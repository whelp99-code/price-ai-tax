name: test
on:
  pull_request:
  push:
    branches: [main]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - run: pytest tests/test_notion_finance_ingest.py tests/test_notion_finance_map.py
      - name: upload and read pipeline tests
        run: pytest tests/test_owner_upload_api.py tests/test_extraction_api.py
