[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "price-tax-agent"
version = "0.2.1"
description = "Independent Korean AI tax-agent internal validation workspace"
requires-python = ">=3.11"
dependencies = ["fastapi==0.141.1", "uvicorn==0.52.4", "pydantic==2.13.5", "httpx==0.28.1"]

[project.optional-dependencies]
test = ["pytest==8.4.2", "pytest-asyncio==1.4.0"]

[project.scripts]
price = "price.cli:main"

[tool.setuptools.packages.find]
include = ["price*"]

[tool.setuptools.package-data]
price = ["static/*", "schema.sql", "rt_registration.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
