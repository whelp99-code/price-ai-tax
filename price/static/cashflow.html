<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>price · 자금 대사 작업실</title><link rel="stylesheet" href="/static/owner.css"><script src="/static/cashflow.js" defer></script></head><body><header class="top"><a class="brand" href="/">price<span>자금 대사 작업실</span></a><select id="cash-company" aria-label="회사"></select></header><main><div class="banner">내부 회계 대사입니다. 송금·카드 승인 취소·세무신고를 실행하는 화면이 아닙니다.</div><div class="intro"><span class="eyebrow">검토 담당자용</span><h1>원매입·카드·통장을<br>한 번씩만 반영합니다.</h1><p>대표는 자료와 업무 사실을 제공합니다. 원본 대조와 장부 검토는 이 작업실에서 처리합니다.</p><p><a href="/">대표 자료함</a> · <a href="/bookkeeping">기장 작업실</a> · <a href="/expert">기존 전문가 화면</a></p></div><div class="row"><p id="cash-user"></p><button id="cash-refresh" class="quiet">새로고침</button></div><p id="cash-error" class="error" role="alert"></p><section class="panel"><h2>회사 계좌 사이 이동</h2><div id="transfer-work"></div></section><section class="panel"><h2>카드 사용·취소·납부·환급</h2><div id="card-work"></div></section><p class="small">금액만 같은 자료는 자동 연결하지 않습니다. 원본의 참조가 부족하면 거래 관계를 별도로 확인해야 합니다.</p></main><dialog id="cash-dialog"><div class="dialog-header"><h2>원본과 처리 내용</h2><button id="cash-close" class="quiet">닫기</button></div><div id="cash-detail"></div><form id="cash-review-form" hidden><label class="check"><input name="verified" type="checkbox" required>표시된 원본·계좌·카드·금액을 독립적으로 확인했습니다.</label><label>검토 사유<input name="reason" required maxlength="2000"></label><button class="primary" type="submit">독립 검토 기록</button></form><p id="cash-dialog-error" class="error" role="alert"></p></dialog></body></html>
